[package]
name = "cc-tmux-stream"
version = "0.2.0"
edition = "2021"
description = "Stream tmux pane contents via WebSocket"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
